<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1a10">
<title>Reconectando · Slime Ascendent</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:#08130d;color:#edfff1;font-family:system-ui,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
main{width:min(100%,390px);padding:26px 22px;border:1px solid #80d99a66;border-radius:22px;background:linear-gradient(145deg,#173323,#0d1c13);box-shadow:0 20px 60px #0009;text-align:center}
.mark{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#e0ffe7,#51d77b 48%,#14532d);color:#07351b;font-size:36px}
h1{font-size:1.35rem;margin:8px 0;color:#b8f7c8}
p{font-size:.88rem;line-height:1.5;color:#d2e8d8;margin:8px 0}
#status{font-size:.76rem;color:#9fd8ad;margin:14px 0}
button{width:100%;min-height:48px;border:1px solid #bdffd0;border-radius:13px;background:linear-gradient(120deg,#7af0a0,#20a454);color:#082411;font-size:.95rem;font-weight:900}
small{display:block;margin-top:14px;color:#99b7a0;font-size:.68rem;line-height:1.4}
</style>
</head>
<body>
<main>
<div class="mark">✦</div>
<h1>Reconectando ao Slime Ascendent</h1>
<p>O servidor pode estar acordando ou sua conexão pode ter oscilado. Seu progresso continua salvo neste aparelho.</p>
<div id="status" role="status" aria-live="polite">Nova tentativa automática em alguns segundos…</div>
<button id="retry" type="button">Tentar agora</button>
<small>Esta tela é temporária. Quando o servidor estiver disponível, a aventura será aberta automaticamente.</small>
</main>
<script>
(function(){
 'use strict';
 var target='https://slime-ascendant.onrender.com/';
 var seconds=8, timer=null, status=document.getElementById('status'), button=document.getElementById('retry');
 function navigate(){status.textContent='Abrindo o jogo…';window.location.replace(target)}
 function countdown(){status.textContent='Nova tentativa automática em '+seconds+'s…';seconds--;if(seconds<0)navigate()}
 button.addEventListener('click',navigate);
 window.addEventListener('online',function(){seconds=1});
 timer=window.setInterval(countdown,1000);
 countdown();
})();
</script>
</body>
</html>
