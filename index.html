{a:'#1c2e20',b:'#213524',bg:'#0a120c',vg:'#000a',d:(X,Y,h)=>{if(h%9==0){x.fillStyle='#2f5a36';const a=(h>>3)%24,b=(h>>6)%24;x.fillRect(X+a,Y+b,2,5);x.fillRect(X+a+3,Y+b+2,2,3)}if(h%47==0){x.fillStyle='#f9a8d4';x.fillRect(X+(h>>4)%26,Y+(h>>7)%26,3,3)}}},

 if(m==0){q.x+=Math.sin(t/900+q.v*9)*.0006;q.y+=Math.cos(t/1100+q.v*7)*.0006;x.globalAlpha=.4+.6*Math.abs(Math.sin(t/500+q.v*9))}

 else{q.y-=q.v*.003;q.x+=Math.sin(t/500+q.v*9)*.0007}
 q.x=(q.x+1)%1;q.y=(q.y+1)%1;x.fillRect(q.x*W,q.y*H,q.s,q.s);x.globalAlpha=1})}

let lw=0,op=0,lv2=0,lx=0,pp=null,lt=0,me=0,S=null,ws,keys={},joy=null,last='',gc=0,gk=0,sh=0,lh=0;

function slime(c,px,py,k,t){px=Math.round(px);py=Math.round(py);
 const b=Math.round(Math.sin(t/200)),col=CO[k],W=W8.map((w,i)=>w+2*b*(i>3));
 c.fillStyle='#0005';c.beginPath();c.ellipse(px,py+1,7*U,2.5*U,0,0,7);c.fill();
 c.fillStyle=dk(col,.4);W.forEach((w,i)=>c.fillRect(px-(w+2)*U/2,py-(8-i)*U,(w+2)*U,U));
 c.fillRect(px-W[0]*U/2,py-9*U,W[0]*U,U);c.fillRect(px-W[7]*U/2,py,W[7]*U,U);
 c.fillStyle=col;W.forEach((w,i)=>c.fillRect(px-w*U/2,py-(8-i)*U,w*U,U));
 c.fillStyle=dk(col,.75);c.fillRect(px-5*U,py-2*U,10*U,2*U);
 c.fillStyle='#fff7';c.fillRect(px-4*U,py-6*U,2*U,U);c.fillRect(px-5*U,py-5*U,U,U);
 c.fillStyle='#fff';c.fillRect(px-3*U,py-5*U,2*U,2*U);c.fillRect(px+U,py-5*U,2*U,2*U);
 c.fillStyle=k=='necromante'?'#f43f5e':'#111';c.fillRect(px-2*U,py-4*U,U,U);c.fillRect(px+2*U,py-4*U,U,U);
 c.fillStyle='#0004';c.fillRect(px-U,py-2*U,2*U,U);
 AC[k].forEach(([dx,dy,w,h,col])=>{c.fillStyle=col;c.fillRect(px+dx*U,py-8*U+dy*U,w*U,h*U)})}

SPR[0]=mkS(['........','..o.....','..oyo...','..oyoooo','.ooaaaaa','.oaacaaa','oaaaaaaa','oaawwaaa','oaawkaaa','oaaaaaaa','oaaaakkk','.obbbbbb','..oobbbb','..obbooo','..oooo..','........'],{o:'#2a0a14',a:'#e0334c',b:'#9c1f3a',c:'#ff7a8a',y:'#ffd23f'});

SPR[3]=mkS(['..y..y.y','..yyyyyy','.ooooooo','oaaccaaa','oaaaaaaa','oaawwaaa','oaaweaaa','oaaaaaaa','oaaakkkk','oaaawkwk','.obbbbbb','obbbbbbb','oabbbbbb','.ooabbbb','..oooooo','........'],{o:'#1a0610',a:'#b91c3c',b:'#7f1230',c:'#f0607a',e:'#ffe14d',y:'#ffd23f'});
SPR[4]=mkS(['........','...ooooo','..oaaccc','.oaaaaaa','.oaaaaaa','.oakkaaa','.oakkaaa','.oaaaaaa','.oaaaakk','.obaaaaa','.obbbbbb','.oaabbbb','.oaoaoao','..o.o.o.','........','........'],{o:'#2d3a63',a:'#dbeafe',b:'#93c5fd',c:'#ffffff'});

function mon(c,X,Y,ty,t){const k=KS[ty],Z=16*k,s=ER[ty],bob=ty==4?Math.sin(t/200+X)*3:0,h=Z*(1+Math.sin(t/120+X)*.05);

 if(ty==3){c.fillStyle='#be123c33';c.beginPath();c.arc(X,Y,s*(1.3+Math.sin(t/200)*.08),0,7);c.fill()}
 if(ty==1){const fl=Math.sin(t/60)*7;c.fillStyle='#4c1d95';c.strokeStyle='#1e1033';c.lineWidth=2;
  [-1,1].forEach(d=>{c.beginPath();c.moveTo(X+d*6,Y-4);c.lineTo(X+d*28,Y-16+fl);c.lineTo(X+d*22,Y-2);c.lineTo(X+d*17,Y+4);c.lineTo(X+d*12,Y-1);c.lineTo(X+d*6,Y+6);c.closePath();c.fill();c.stroke()})}

function lobby(){
 $('bal').textContent='🪙 '+SV.co+'    💎 '+SV.cr;$('sel').textContent='Classe: '+LB[SV.sel];$('rec').textContent='🏆 Recorde: onda '+SV.best;

 ws.onopen=()=>{go.disabled=false;go.textContent='Jogar';op=1;lw=0;gc=gk=0;ws.send(JSON.stringify({t:'join',cls:SV.cls.includes(SV.sel)?SV.sel:'normal',map:SV.map,it:SV.items,name:SV.name,up:SV.up}));$('m').style.display='none';$('ex').style.display='block'};
