services:
  - type: web
    name: Slime-ascendant
    runtime: node
    repo: https://github.com/soaressilvabernardo455-svg/Slime-ascendant
    branch: main
    region: virginia
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slime-ascendant-accounts
          property: connectionString

databases:
  - name: slime-ascendant-accounts
    plan: free
    region: virginia
